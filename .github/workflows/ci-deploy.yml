name: Testes e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (unitários + web/mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Relatório dos testes (com capturas de tela)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Publicar na Hostinger
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conferir configuração
        id: config
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning title=Publicação não configurada::Crie a variável SITE_URL (ex.: https://www.seudominio.com.br) em Settings > Secrets and variables > Actions > Variables. Veja o README."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SITE_URL" in
            https://*) ;;
            *) echo "::error title=SITE_URL inválida::SITE_URL precisa começar com https://"; exit 1 ;;
          esac
          echo "build=true" >> "$GITHUB_OUTPUT"
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning title=FTP não configurado::O site foi gerado, mas não enviado. Baixe o artefato site-hostinger e envie pelo Gerenciador de Arquivos, ou crie os secrets FTP_SERVER, FTP_USERNAME e FTP_PASSWORD. Veja o README."
            echo "ftp=false" >> "$GITHUB_OUTPUT"
          else
            echo "ftp=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.config.outputs.build == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.build == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.config.outputs.build == 'true'
      - name: Gerar o site para o domínio
        if: steps.config.outputs.build == 'true'
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: /

      - name: Guardar o site gerado (para envio manual, se preciso)
        if: steps.config.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-hostinger
          path: dist/
          include-hidden-files: true # inclui o .htaccess
          retention-days: 30

      # O hPanel mostra o servidor como "ftp://endereço". Aqui o valor é limpo
      # (sem protocolo, porta, pasta ou espaços) e o endereço é conferido no DNS.
      - name: Conferir servidor FTP
        if: steps.config.outputs.ftp == 'true'
        env:
          RAW: ${{ secrets.FTP_SERVER }}
        run: |
          host="$(printf '%s' "$RAW" | tr -d '[:space:]')"
          case "$host" in
            *://*) echo "::warning title=FTP_SERVER ajustado::O valor tinha o prefixo do protocolo (ex.: ftp://), removido automaticamente."; host="${host#*://}" ;;
          esac
          host="${host%%/*}"
          case "$host" in
            *:*) echo "::warning title=FTP_SERVER ajustado::O valor tinha a porta (ex.: :21), removida automaticamente."; host="${host%%:*}" ;;
          esac
          echo "::add-mask::$host"
          if ! getent hosts "$host" > /dev/null; then
            echo "::error title=Servidor FTP não encontrado::O endereço em FTP_SERVER não existe no DNS. Em hPanel > Arquivos > Contas FTP, copie o IP do servidor FTP (só os números, sem ftp://) e salve no secret FTP_SERVER."
            exit 1
          fi
          echo "FTP_HOST=$host" >> "$GITHUB_ENV"

      - name: Enviar para a Hostinger por FTP
        if: steps.config.outputs.ftp == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
